name: Release desktop

# Crea un borrador de release con el instalador al empujar una etiqueta desktop-v*; se publica a mano tras probarlo.
# Receta: docs/escritorio-publicar.md
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La etiqueta debe coincidir con la versión de los dos archivos que la app y el instalador leen.
      - name: Check tag matches version
        shell: bash
        run: |
          conf=$(grep -m1 '"version"' desktop/src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*//')
          cargo=$(grep -m1 '^version' desktop/src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)".*//')
          echo "tag=$GITHUB_REF_NAME conf=$conf cargo=$cargo"
          if [ "$GITHUB_REF_NAME" != "desktop-v$conf" ] || [ "$GITHUB_REF_NAME" != "desktop-v$cargo" ]; then
            echo "La etiqueta debe ser desktop-v<version> y coincidir con tauri.conf.json y Cargo.toml" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # La raíz aporta las dependencias del código compartido (../src).
      - name: Install dependencies (root)
        run: bun install --frozen-lockfile

      - name: Install dependencies (desktop)
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Desktop checks (typecheck, lint, Vitest)
        run: bun run desktop:check

      - name: Rust tests
        run: bun run desktop:rust-test

      # No usa tauri.debug.conf.json: la release necesita createUpdaterArtifacts y la firma.
      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Vite las incrusta en el instalador; sin ellas el build falla (missingEnv).
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          tagName: desktop-v__VERSION__
          releaseName: Recibo __VERSION__
          releaseDraft: true
          prerelease: false
