name: Release desktop

# Publica el instalador de Windows al empujar una etiqueta desktop-v*.
# Receta: docs/escritorio-publicar.md
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      # La raíz aporta las dependencias del código compartido (../src).
      - name: Install dependencies (root)
        run: bun install --frozen-lockfile

      - name: Install dependencies (desktop)
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Desktop checks (typecheck, lint, Vitest)
        run: bun run desktop:check

      - name: Rust tests
        run: bun run desktop:rust-test

      # No usa tauri.debug.conf.json: la release necesita createUpdaterArtifacts y la firma.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Vite las incrusta en el instalador; sin ellas el build falla (missingEnv).
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        with:
          projectPath: desktop
          tauriScript: bun run tauri
          tagName: desktop-v__VERSION__
          releaseName: Recibo __VERSION__
          releaseDraft: false
          prerelease: false
