[package]
name = "recibo-desktop"
version = "0.1.0"
description = "Recibo para Windows"
edition = "2021"

[lib]
name = "recibo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
